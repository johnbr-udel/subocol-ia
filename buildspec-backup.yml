version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 569345298620.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Building Lambda Docker image
      - docker build -t subocol-lambda .
      - docker tag subocol-lambda:latest 569345298620.dkr.ecr.us-east-1.amazonaws.com/subocol-lambda:latest

  post_build:
    commands:
      - echo Pushing image to Amazon ECR
      - docker push 569345298620.dkr.ecr.us-east-1.amazonaws.com/subocol-lambda:latest
      - echo Image pushed successfully